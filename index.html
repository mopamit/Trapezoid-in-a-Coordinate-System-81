:root{--blue:#17365e;--green:#6db580;--mustard:#e7b976;--bordo:#832058;--line:#6f7f8f;--grid:#ece8de;--bg:#f7f5ef;--card:#fff;--border:#e6e1d6;--radius:20px;
  --ui:"Simpler Pro","Segoe UI",Arial,sans-serif;--math:"Times New Roman",Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--blue);font-family:var(--ui);font-size:18px;line-height:1.55}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--bordo);outline-offset:3px}

.topbar{direction:ltr;display:grid;grid-template-columns:minmax(110px,1fr) auto minmax(110px,1fr);align-items:center;gap:16px;padding:12px clamp(12px,3vw,28px);background:var(--card);border-bottom:1px solid var(--border)}
.topbar .logo{height:42px;width:auto;display:block;justify-self:start}
.topbar h1{direction:rtl;text-align:center;margin:0;color:var(--bordo);font-weight:700;font-size:clamp(20px,2.4vw,28px);line-height:1.2}
.topbar .actions{direction:rtl;display:flex;gap:10px;justify-self:end}
.btn{font-family:var(--ui);font-size:16px;font-weight:600;border-radius:12px;padding:9px 18px;min-height:44px;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--blue)}
.btn:hover{background:#f3f1ea}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(.95);background:var(--green)}
.btn.next{display:inline-flex;align-items:center;gap:10px;padding:6px 18px 6px 8px;font-size:17px;font-weight:700}
.btn.next img{width:32px;height:32px}
.btn:disabled{opacity:.45;cursor:default;filter:none}

main{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:22px;padding:22px clamp(12px,3vw,28px);max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 10px rgba(23,54,94,.05)}
.instructions{padding:20px 22px;align-self:start}
.steps{display:flex;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.steps button{font-family:var(--ui);font-size:15px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:#7d8a99;border-radius:20px;padding:4px 12px;min-height:36px;cursor:pointer}
.steps button.done{color:var(--blue);border-color:var(--green)}
.steps button.now{background:var(--bordo);border-color:var(--bordo);color:#fff}
.steps button:disabled{cursor:default}
.instructions h2{color:var(--bordo);font-size:clamp(22px,2.3vw,28px);margin:0 0 10px;line-height:1.25}
.instructions p{margin:0 0 10px}
.targets{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.targets li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;border:1.5px solid var(--border);background:#fff}
.targets li.ok{border-color:var(--green);background:rgba(109,181,128,.10)}
.swatch{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);margin-top:3px}
.tick{margin-inline-start:auto;color:#2f6b40;font-weight:700}
.q{font-weight:700;font-size:19px;margin:6px 0 10px}
.opts{display:grid;gap:8px}
.opt{font-family:var(--ui);font-size:18px;text-align:right;padding:10px 14px;border-radius:14px;border:2px solid var(--border);background:#fff;color:var(--blue);cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.correct{border-color:var(--green);background:rgba(109,181,128,.14)}
.opt.wrong{border-color:var(--mustard);background:rgba(231,185,118,.14);color:#6a7888}
.opt:disabled{cursor:default}
.fb{margin:10px 0 0;padding:10px 14px;border-radius:14px;font-size:17px}
.fb:empty{display:none}
.fb.ok{background:rgba(109,181,128,.14);border:1.5px solid var(--green)}
.fb.bad{background:rgba(231,185,118,.16);border:1.5px solid var(--mustard)}
.readout{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(231,185,118,.16);font-size:18px;line-height:1.8}
.readout .big{font-size:20px}

.type{margin-top:10px;padding:10px 14px;border-radius:14px;background:#f3f6fa;font-size:17px;min-height:3.4em}
.nav{display:flex;justify-content:flex-start;margin-top:16px}
.challenges{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.challenges li{display:flex;gap:8px;align-items:center;font-size:17px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--border)}
.challenges li.ok{border-color:var(--green);background:rgba(109,181,128,.10)}
.challenges .box{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff}
.challenges li.ok .box{background:var(--green);border-color:var(--green)}

.stage{position:relative;padding:8px}
.stage canvas{display:block;width:100%;height:clamp(440px,calc(100vh - 150px),780px);touch-action:none;border-radius:14px}
.m{direction:ltr;unicode-bidi:isolate;font-family:var(--math);white-space:nowrap}
.m i{font-style:italic}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  .stage{order:-1}
  .stage canvas{height:auto;aspect-ratio:17/13.4;min-height:280px}
  .topbar .logo{height:32px}
}
@media (max-width:560px){
  .topbar{grid-template-columns:auto 1fr;gap:8px}
  .topbar h1{grid-column:1/-1;grid-row:2;font-size:20px}
  .topbar .actions{grid-column:2;grid-row:1}
  .btn{padding:8px 12px;font-size:15px}
  .steps button{font-size:14px;padding:3px 9px}
}
</style>
</head>

<script>
'use strict';
(()=>{
/* ---------- קבועי עיצוב ---------- */
const C={blue:'#17365e',green:'#6db580',mustard:'#e7b976',bordo:'#832058',line:'#6f7f8f',grid:'#ece8de'};
const W={line:2.2,aux:1.9,ring:3};
const POINT_R=7,HALO_R=14,HIT_R=24;
/* צבע קבוע לכל חלק בכל השלבים */
const FILL={rect:'rgba(231,185,118,.55)',triA:'rgba(109,181,128,.45)',triB:'rgba(23,54,94,.20)'};
const XMIN=-8,XMAX=8,YMIN=-6,YMAX=6;

const $=s=>document.querySelector(s);
const mn=n=>(n<0?'−':'')+fmt(Math.abs(n));
const fmt=n=>Number.isInteger(n)?String(n):String(Math.round(n*10)/10);
const pt=(x,y)=>`<span class="m">(${mn(x)}, ${mn(y)})</span>`;
const M=s=>`<span class="m">${s}</span>`;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- נתוני הטרפז ----------
   A=(r,b)  B=(s,b)  C=(q,t)  D=(p,t);  r<p<q<s ,  b<t
   מלבן p..q ; משולש א' מימין (q..s) ; משולש ב' משמאל (r..p) */
const DEFAULT={r:-5,p:-2,q:3,s:6,b:2,t:5};
let T={...DEFAULT};
let st;           // מצב כללי
const STEPS=['הרכבה','קריאה','שטח','חקר'];

function piecesFor(T){return [
  {id:'rect',name:'המלבן',pts:[[T.p,T.b],[T.q,T.b],[T.q,T.t],[T.p,T.t]]},
  {id:'triA',name:'משולש א׳',pts:[[T.q,T.b],[T.s,T.b],[T.q,T.t]]},
  {id:'triB',name:'משולש ב׳',pts:[[T.r,T.b],[T.p,T.b],[T.p,T.t]]}];}
/* החלקים מתחילים בחצי השני של מערכת הצירים, זה ליד זה */
function startOffsets(pieces){
  const upper=T.b>=0, order=shuffle(pieces), widths=order.map(p=>Math.max(...p.pts.map(v=>v[0]))-Math.min(...p.pts.map(v=>v[0])));
  const total=widths.reduce((a,b)=>a+b,0)+2*(order.length-1);let x=Math.floor(-total/2);
  order.forEach((pc,i)=>{const minx=Math.min(...pc.pts.map(v=>v[0]));pc.dx=x-minx;pc.dy=upper?(-1-T.t):(1-T.b);x+=widths[i]+2;});
}
function freshState(stage=0){
  const pieces=piecesFor(T);startOffsets(pieces);
  st={stage,maxStage:stage,pieces,qi:0,tries:0,answered:false,highlight:null,
      E:{A:[T.r,T.b],B:[T.s,T.b],C:[T.q,T.t],D:[T.p,T.t]},seen:{}, sel:null};
}
function randomT(){
  for(let k=0;k<200;k++){
    const h=rnd(2,4),a1=rnd(1,3),w=rnd(2,5),a2=rnd(1,3),total=a1+w+a2;
    const r=rnd(-8,8-total),upper=Math.random()<.5;
    const b=upper?rnd(0,6-h):rnd(-6,-h);
    const N={r,p:r+a1,q:r+a1+w,s:r+total,b,t:b+h};
    if(a1===a2&&Math.random()<.5)continue;
    if(JSON.stringify(N)!==JSON.stringify(T))return N;
  }
  return {...DEFAULT};
}

/* ---------- שאלות ---------- */
function uniqOpts(correct,cands){const out=[correct],seen=new Set([correct.v]);
  for(const c of cands){if(out.length>=3)break;if(c.v>0&&!seen.has(c.v)){seen.add(c.v);out.push(c);}}
  for(let d=2;out.length<3;d++){const v=correct.v+d;if(!seen.has(v)){seen.add(v);out.push({v,fb:'בדקו שוב: כמה יחידות יש בין שני הקודקודים?'});}}
  return shuffle(out);}
function lenQ(name,x1,x2,y,hl){
  const L=x2-x1;const c=[{v:L+1,fb:'נראה שספרתם את הנקודות שעל הקטע. סופרים את <b>היחידות</b> שבין הקודקודים — או מחשבים הפרש של שיעורי ה־x.'}];
  if(x1<0&&x2>0)c.push({v:Math.abs(x2-Math.abs(x1)),fb:`שימו לב לשיעור השלילי: מ־${M(mn(x1))} עד ${M('0')} יש ${M(fmt(-x1))} יחידות, ומ־${M('0')} עד ${M(mn(x2))} עוד ${M(fmt(x2))}.`});
  c.push({v:L-1,fb:'חסרה יחידה. ספרו שוב את המשבצות שבין הקודקודים.'});
  return {hl,q:`מה אורך הבסיס ${M(name)}?`,opts:uniqOpts({v:L,ok:true},c),
    why:`${M(name+' = '+mn(x2)+' − '+(x1<0?'('+mn(x1)+')':mn(x1))+' = '+fmt(L))}. לשני הקודקודים אותו שיעור y, ולכן האורך הוא הפרש שיעורי ה־x.`};
}
function readQs(){const h=T.t-T.b;
  const par={hl:'par',q:'אילו צלעות בטרפז מקבילות?',opts:shuffle([
    {v:1,ok:true,t:`${M('AB')} ו־${M('DC')}`},
    {v:2,t:`${M('AD')} ו־${M('BC')}`,fb:`בדקו את השיעורים: האם ל־${M('A')} ול־${M('D')} יש אותו שיעור? הצלעות האלה נוטות, והן לא מקבילות.`},
    {v:3,t:`${M('AB')} ו־${M('BC')}`,fb:`${M('AB')} ו־${M('BC')} נפגשות בקודקוד ${M('B')}, ולכן הן לא יכולות להיות מקבילות.`}]),
    why:`ל־${M('A')} ול־${M('B')} אותו שיעור y ${M('('+mn(T.b)+')')}, ולכן ${M('AB')} אופקית. גם ל־${M('D')} ול־${M('C')} אותו שיעור y ${M('('+mn(T.t)+')')}. שני ישרים אופקיים מקבילים.`};
  const hc=[];if(T.b!==0&&Math.abs(T.t+T.b)!==h)hc.push({v:Math.abs(T.t+T.b),fb:`את המרחק מחשבים בהפרש: שיעור ה־y של ${M('DC')} פחות שיעור ה־y של ${M('AB')}, ולא בסכום.`});
  hc.push({v:Math.abs(T.t),fb:`${M(mn(T.t))} הוא שיעור ה־y של הבסיס ${M('DC')}, לא המרחק בין הבסיסים.`},{v:h+1,fb:'ספרו את היחידות בין שני הקווים האופקיים, לא את הקווים עצמם.'});
  const ht={hl:'h',q:'מה הגובה של הטרפז — המרחק בין שני הבסיסים?',opts:uniqOpts({v:h,ok:true},hc),
    why:`${M('h = '+mn(T.t)+' − '+(T.b<0?'('+mn(T.b)+')':mn(T.b))+' = '+h)}. הגובה הוא הפרש שיעורי ה־y של שני הבסיסים.`};
  return [par,lenQ('AB',T.r,T.s,T.b,'AB'),lenQ('DC',T.p,T.q,T.t,'DC'),ht];}
function areaQs(){const h=T.t-T.b,w=T.q-T.p,a1=T.p-T.r,a2=T.s-T.q;
  const tri=(name,a,hl)=>({hl,q:`מה השטח של ${name}?`,opts:uniqOpts({v:a*h/2,ok:true},[
      {v:a*h,fb:`זה השטח של המלבן שמסביב למשולש. המשולש הישר־זווית הוא <b>חצי</b> ממנו.`},{v:a+h,fb:'בשטח כופלים, לא מחברים.'},{v:a*h/2+1,fb:'בדקו שוב: ניצב כפול ניצב, חלקי 2.'}]),
      why:`${M(fmt(a)+' × '+h+' ÷ 2 = '+fmt(a*h/2))}. הניצבים הם ${M(fmt(a))} ו־${M(String(h))}.`});

      why:`${M(w+' × '+h+' = '+w*h)}`},tri('משולש א׳',a2,'triA'),tri('משולש ב׳',a1,'triB')];}

/* ---------- פאנל ---------- */

}

function render(){

    const q=st.qs[st.qi];st.highlight=q?q.hl:null;

    P.innerHTML=(st.stage===1?`<h2>מה מספרים השיעורים?</h2>${coords}`:`<h2>מה שטח הטרפז?</h2><p>שטח הטרפז שווה לסכום השטחים של שלושת החלקים.</p>`)+
      (q?`<p class="q">${q.q}</p><div class="opts">${q.opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${o.t||M(fmt(o.v))}</button>`).join('')}</div><div class="fb" id="fb"></div>`:'')+

      <div class="readout" id="readout"></div><div class="type" id="type"></div>

function readSummary(){return `<div class="fb ok"><b>מצוין!</b> מהשיעורים גיליתם: ${M('AB ∥ DC')}, ${M('AB = '+(T.s-T.r))}, ${M('DC = '+(T.q-T.p))}, והגובה ${M('h = '+(T.t-T.b))}.</div>`;}
function areaSummary(){const h=T.t-T.b,w=T.q-T.p,a1=T.p-T.r,a2=T.s-T.q,AB=T.s-T.r,DC=w,S=w*h+a1*h/2+a2*h/2;

  <div style="margin-top:8px">ועכשיו בעזרת הבסיסים והגובה:</div><div class="big">${M('(AB + DC) × h ÷ 2')}</div><div class="big">${M('= ('+AB+' + '+DC+') × '+h+' ÷ 2 = '+fmt(S))}</div></div>
  <div class="fb ok"><b>אותה תוצאה!</b> שטח טרפז: סכום הבסיסים, כפול הגובה, חלקי 2. בשלב הבא תבדקו שזה נכון לכל טרפז.</div>`;}

$('#panel').addEventListener('click',e=>{

function goStage(i){

/* ---------- שלב 1: הרכבה ---------- */
const placed=pc=>pc.dx===0&&pc.dy===0;
function updateBuild(){
  st.pieces.forEach(pc=>{const li=$('#tg-'+pc.id);if(!li)return;li.classList.toggle('ok',placed(pc));li.querySelector('.tick').textContent=placed(pc)?'✓ במקום':'';});
  const all=st.pieces.every(placed);
  if($('#fb')){$('#fb').className=all?'fb ok':'fb';$('#fb').innerHTML=all?`<b>בניתם טרפז!</b> קודקודיו: ${M('A = ('+mn(T.r)+', '+mn(T.b)+')')}, ${M('B = ('+mn(T.s)+', '+mn(T.b)+')')}, ${M('C = ('+mn(T.q)+', '+mn(T.t)+')')}, ${M('D = ('+mn(T.p)+', '+mn(T.t)+')')}.`:'';}
  setNext(all);

/* ---------- שלב 4: חקר ---------- */
function measures(){const {A,B,C,D}=st.E;const AB=B[0]-A[0],DC=C[0]-D[0],h=D[1]-A[1];return {AB,DC,h,S:(AB+DC)*h/2,leftOff:D[0]-A[0],rightOff:B[0]-C[0]};}
const CHAL=[
  {id:'right',t:'בנו טרפז ישר־זווית.',test:m=>m.DC>0&&m.DC!==m.AB&&(m.leftOff===0||m.rightOff===0)},
  {id:'iso',t:'בנו טרפז שווה־שוקיים.',test:m=>m.DC>0&&m.DC!==m.AB&&Math.abs(m.leftOff)===Math.abs(m.rightOff)},
  {id:'s12',t:`בנו טרפז ששטחו ${M('12')}.`,test:m=>m.DC>0&&m.DC!==m.AB&&m.S===12},
  {id:'eq',t:`גלו מה קורה כש־${M('DC = AB')}.`,test:m=>m.DC===m.AB},
  {id:'zero',t:`גלו מה קורה כש־${M('DC = 0')}.`,test:m=>m.DC===0}];
function updateExplore(){
  const m=measures(),{A,B,C,D}=st.E,r=$('#readout');if(!r)return;
  const yb=A[1],yt=D[1];
  r.innerHTML=`<div>${M('A = ('+mn(A[0])+', '+mn(A[1])+')')}&emsp;${M('B = ('+mn(B[0])+', '+mn(B[1])+')')}</div><div>${M('D = ('+mn(D[0])+', '+mn(D[1])+')')}&emsp;${M('C = ('+mn(C[0])+', '+mn(C[1])+')')}</div>
   <div>${M('AB = '+m.AB)}&emsp;${M('DC = '+m.DC)}&emsp;${M('h = '+mn(yt)+' − '+(yb<0?'('+mn(yb)+')':mn(yb))+' = '+m.h)}</div>
   <div class="big"><b>שטח:</b> ${M('('+m.AB+' + '+m.DC+') × '+m.h+' ÷ 2 = '+fmt(m.S))}</div>`;
  let type;
  if(m.DC===0)type=`<b>התקבל משולש.</b> גם עכשיו הנוסחה עובדת: ${M('('+m.AB+' + 0) × '+m.h+' ÷ 2')} — וזו בדיוק נוסחת שטח המשולש: בסיס × גובה ÷ 2.`;
  else if(m.DC===m.AB)type=`<b>התקבלה מקבילית</b> — זה כבר לא טרפז, כי יש שני זוגות של צלעות מקבילות. גם כאן הנוסחה נותנת את השטח: ${M('('+m.AB+' + '+m.DC+') × '+m.h+' ÷ 2 = '+m.AB+' × '+m.h)}.`;
  else if(m.leftOff===0||m.rightOff===0)type='<b>טרפז ישר־זווית:</b> אחת השוקיים מאונכת לבסיסים.';
  else if(Math.abs(m.leftOff)===Math.abs(m.rightOff))type='<b>טרפז שווה־שוקיים:</b> שתי השוקיים שוות באורכן.';
  else type='<b>טרפז:</b> זוג אחד של צלעות מקבילות.';
  $('#type').innerHTML=type;
  if(st.moved)CHAL.forEach(c=>{if(c.test(m))st.seen[c.id]=true;});
  $('#chal').innerHTML=CHAL.map(c=>`<li class="${st.seen[c.id]?'ok':''}"><span class="box">${st.seen[c.id]?'✓':''}</span><span>${c.t}</span></li>`).join('');
}
/* אילוצים: AB ו־DC אופקיים, A משמאל ל־B, D לא מימין ל־C, הבסיס העליון מעל התחתון */
function moveVertex(k,x,y){
  const E=st.E,before=JSON.stringify(E);
  moveVertexRaw(k,x,y);if(JSON.stringify(E)!==before)st.moved=true;}
function moveVertexRaw(k,x,y){
  const E=st.E;x=Math.max(XMIN,Math.min(XMAX,x));y=Math.max(YMIN,Math.min(YMAX,y));
  if(k==='A'||k==='B'){y=Math.min(y,E.D[1]-1);if(k==='A')x=Math.min(x,E.B[0]-1);else x=Math.max(x,E.A[0]+1);E[k]=[x,y];E.A[1]=E.B[1]=y;}
  else{y=Math.max(y,E.A[1]+1);if(k==='D')x=Math.min(x,E.C[0]);else x=Math.max(x,E.D[0]);E[k]=[x,y];E.C[1]=E.D[1]=y;}
}

/* ---------- Canvas ---------- */
const cv=$('#board'),ctx=cv.getContext('2d');let VW=0,VH=0,U=30,OX=0,OY=0;
function layout(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;VW=r.width;VH=r.height;cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  U=Math.min((VW-50)/(XMAX-XMIN+1.2),(VH-50)/(YMAX-YMIN+1.4));OX=VW/2-(XMAX+XMIN)/2*U;OY=VH/2+(YMAX+YMIN)/2*U+4;}
const sx=x=>OX+x*U,sy=y=>OY-y*U,wx=px=>(px-OX)/U,wy=py=>(OY-py)/U;
function arrow(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1),L=11;ctx.beginPath();ctx.moveTo(x2+Math.cos(a)*4,y2+Math.sin(a)*4);ctx.lineTo(x2-L*Math.cos(a-.42),y2-L*Math.sin(a-.42));ctx.lineTo(x2-L*Math.cos(a+.42),y2-L*Math.sin(a+.42));ctx.closePath();ctx.fill();}
function text(s,x,y,px,color,align='center',bold=true,font='ui'){ctx.font=`${bold?'700 ':''}${px}px ${font==='math'?'"Times New Roman",Georgia,serif':'"Simpler Pro","Segoe UI",Arial'}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction='ltr';ctx.fillText(s,x,y);}
function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(sx(x),sy(y)):ctx.moveTo(sx(x),sy(y)));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.stroke();}}
function seg(a,b,color,lw,dash){ctx.save();ctx.setLineDash(dash||[]);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx(a[0]),sy(a[1]));ctx.lineTo(sx(b[0]),sy(b[1]));ctx.stroke();ctx.restore();}
function dot(x,y,color,active,hover){if(hover){ctx.beginPath();ctx.arc(sx(x),sy(y),HALO_R,0,7);ctx.fillStyle='rgba(131,32,88,.16)';ctx.fill();}
  ctx.beginPath();ctx.arc(sx(x),sy(y),POINT_R,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=W.ring;ctx.strokeStyle=color;ctx.stroke();ctx.beginPath();ctx.arc(sx(x),sy(y),2.2,0,7);ctx.fillStyle=color;ctx.fill();}
function label(n,x,y,dx,dy,color){text(n,sx(x)+dx,sy(y)+dy,Math.max(16,Math.min(19,U*.5)),color||C.blue,'center',true,'math');}
function lenTag(a,b,str,above){const mx=(sx(a[0])+sx(b[0]))/2,my=sy(a[1])+(above?-16:18);text(str,mx,my,Math.max(15,Math.min(18,U*.48)),C.blue,'center',true,'math');}
function grid(){
  ctx.save();ctx.setLineDash([2,4]);ctx.strokeStyle='#e2ddd0';ctx.lineWidth=1;
  for(let x=XMIN;x<=XMAX;x++){ctx.beginPath();ctx.moveTo(sx(x),sy(YMIN));ctx.lineTo(sx(x),sy(YMAX));ctx.stroke();}
  for(let y=YMIN;y<=YMAX;y++){ctx.beginPath();ctx.moveTo(sx(XMIN),sy(y));ctx.lineTo(sx(XMAX),sy(y));ctx.stroke();}
  ctx.restore();
  ctx.strokeStyle=C.line;ctx.fillStyle=C.line;ctx.lineWidth=W.line;ctx.lineCap='round';
  arrow(sx(XMIN-.3),sy(0),sx(XMAX+.55),sy(0));arrow(sx(0),sy(YMIN-.3),sx(0),sy(YMAX+.6));
  text('x',sx(XMAX+.55),sy(0)-15,18,C.blue,'center',false,'math');text('y',sx(0)+15,sy(YMAX+.6),18,C.blue,'center',false,'math');
  const step=U<26?2:1,np=Math.max(12,Math.min(14,U*.38));
  for(let x=XMIN;x<=XMAX;x++)if(x&&x%step===0)text(mn(x),sx(x),sy(0)+np*.95,np,'#5d6b7a','center',false);
  for(let y=YMIN;y<=YMAX;y++)if(y&&y%step===0)text(mn(y),sx(0)-6,sy(y),np,'#5d6b7a','right',false);
  text('0',sx(0)-6,sy(0)+np*.95,np,'#5d6b7a','right',false);
}
let hover=null,drag=null;
function trapLabels(E,col){label('A',E.A[0],E.A[1],-14,16,col);label('B',E.B[0],E.B[1],14,16,col);label('C',E.C[0],E.C[1],14,-16,col);label('D',E.D[0],E.D[1],-14,-16,col);}
function draw(){
  if(!VW)layout();ctx.clearRect(0,0,VW,VH);grid();
  if(st.stage===0){
    st.pieces.forEach(pc=>{const pts=pc.pts.map(([x,y])=>[x+pc.dx,y+pc.dy]),ok=placed(pc),act=drag&&drag.pc===pc,hv=hover&&hover.pc===pc||st.sel===pc;
      poly(pts,FILL[pc.id],ok?C.green:(act||hv)?C.bordo:C.line,ok?3:W.line);
      if(act||hv)pts.forEach(([x,y])=>{dot(x,y,C.bordo,false,false);});});
    if(drag){const pts=drag.pc.pts.map(([x,y])=>[x+drag.pc.dx,y+drag.pc.dy]);pts.forEach(([x,y])=>{const tag='('+mn(x)+', '+mn(y)+')';ctx.font='700 15px "Times New Roman"';const w=ctx.measureText(tag).width+10;ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(sx(x)-w/2,sy(y)-34,w,22);text(tag,sx(x),sy(y)-23,15,C.bordo,'center',true,'math');});}
    if(st.pieces.every(placed))trapLabels({A:[T.r,T.b],B:[T.s,T.b],C:[T.q,T.t],D:[T.p,T.t]});
  }else if(st.stage===1||st.stage===2){
    const P=piecesFor(T),hl=st.highlight,E={A:[T.r,T.b],B:[T.s,T.b],C:[T.q,T.t],D:[T.p,T.t]};
    P.forEach(pc=>poly(pc.pts,st.stage===2&&hl&&hl!==pc.id&&['rect','triA','triB'].includes(hl)?'rgba(230,225,214,.35)':FILL[pc.id],C.line,W.aux));
    poly([E.A,E.B,E.C,E.D],null,C.line,W.line);
    const done=st.done||{};
    if(st.stage===1){
      if(hl==='par'||done.par){seg(E.A,E.B,done.par?C.green:C.blue,4.5);seg(E.D,E.C,done.par?C.green:C.blue,4.5);}
      if(hl==='AB'||done.AB){seg(E.A,E.B,C.blue,4.5);if(done.AB)lenTag(E.A,E.B,'AB = '+(T.s-T.r),false);}
      if(hl==='DC'||done.DC){seg(E.D,E.C,C.blue,4.5);if(done.DC)lenTag(E.D,E.C,'DC = '+(T.q-T.p),true);}
      if(hl==='h'||done.h){seg([T.p,T.t],[T.p,T.b],C.bordo,W.aux,[6,5]);if(done.h)text('h = '+(T.t-T.b),sx(T.p)+8,sy((T.t+T.b)/2),Math.max(15,Math.min(18,U*.48)),C.bordo,'left',true,'math');}
    }else{
      seg([T.p,T.t],[T.p,T.b],C.line,W.aux,[6,5]);seg([T.q,T.t],[T.q,T.b],C.line,W.aux,[6,5]);
      const h=T.t-T.b,cy=(T.t+T.b)/2,fs=Math.max(15,Math.min(19,U*.5));
      const show=(id,x,val)=>{if(done[id]||!st.qs||!st.qs[st.qi])text(fmt(val),sx(x),sy(cy),fs,C.blue,'center',true,'math');};
      show('rect',(T.p+T.q)/2,(T.q-T.p)*h);show('triA',T.q+(T.s-T.q)/3,(T.s-T.q)*h/2);show('triB',T.p-(T.p-T.r)/3,(T.p-T.r)*h/2);
    }
    [E.A,E.B,E.C,E.D].forEach(v=>dot(v[0],v[1],C.blue));trapLabels(E);
  }else{
    const E=st.E,m=measures();
    if(m.leftOff>=0&&m.rightOff>=0&&m.DC>0){ // פירוק למלבן ושני משולשים כשהוא אפשרי
      poly([[E.D[0],E.A[1]],[E.C[0],E.A[1]],E.C,E.D],FILL.rect);if(m.rightOff>0)poly([[E.C[0],E.A[1]],E.B,E.C],FILL.triA);if(m.leftOff>0)poly([E.A,[E.D[0],E.A[1]],E.D],FILL.triB);
    }else poly([E.A,E.B,E.C,E.D],'rgba(231,185,118,.35)');
    poly([E.A,E.B,E.C,E.D],null,C.line,W.line);
    seg(E.A,E.B,C.blue,4);if(m.DC>0)seg(E.D,E.C,C.blue,4);
    seg(E.D,[E.D[0],E.A[1]],C.bordo,W.aux,[6,5]);
    text('h = '+m.h,sx(E.D[0])+(m.leftOff<0?-8:8),sy((E.D[1]+E.A[1])/2),Math.max(15,Math.min(18,U*.48)),C.bordo,m.leftOff<0?'right':'left',true,'math');
    lenTag(E.A,E.B,'AB = '+m.AB,false);if(m.DC>0)lenTag(E.D,E.C,'DC = '+m.DC,true);
    ['A','B','C','D'].forEach(k=>dot(E[k][0],E[k][1],C.bordo,true,(hover&&hover.v===k)||(drag&&drag.v===k)||st.sel===k));
    trapLabels(E,C.bordo);
  }
}

/* ---------- גרירה (Pointer Events) ---------- */
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function hit(px,py){
  if(st.stage===0){const x=wx(px),y=wy(py);for(const pc of [...st.pieces].reverse()){const pts=pc.pts.map(([a,b])=>[a+pc.dx,b+pc.dy]);if(inPoly(x,y,pts))return {pc};
      if(pts.some(([a,b])=>Math.hypot(sx(a)-px,sy(b)-py)<HIT_R))return {pc};}}
  if(st.stage===3){let best=null,bd=HIT_R;for(const k of ['C','D','A','B']){const v=st.E[k],d=Math.hypot(sx(v[0])-px,sy(v[1])-py);if(d<bd){bd=d;best={v:k};}}return best;}
  return null;}
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
cv.addEventListener('pointerdown',e=>{const [px,py]=pos(e),h=hit(px,py);if(!h)return;e.preventDefault();cv.setPointerCapture(e.pointerId);
  drag={...h,gx:wx(px),gy:wy(py),dx0:h.pc?h.pc.dx:0,dy0:h.pc?h.pc.dy:0};if(h.pc){st.pieces.splice(st.pieces.indexOf(h.pc),1);st.pieces.push(h.pc);}cv.style.cursor='grabbing';draw();});
cv.addEventListener('pointermove',e=>{const [px,py]=pos(e);
  if(!drag){hover=hit(px,py);cv.style.cursor=hover?'grab':'default';draw();return;}
  if(drag.pc){const pc=drag.pc;let dx=drag.dx0+Math.round(wx(px)-drag.gx),dy=drag.dy0+Math.round(wy(py)-drag.gy);
    const xs=pc.pts.map(v=>v[0]),ys=pc.pts.map(v=>v[1]);dx=Math.max(XMIN-Math.min(...xs),Math.min(XMAX-Math.max(...xs),dx));dy=Math.max(YMIN-Math.min(...ys),Math.min(YMAX-Math.max(...ys),dy));
    if(dx!==pc.dx||dy!==pc.dy){pc.dx=dx;pc.dy=dy;updateBuild();}}
  else{moveVertex(drag.v,Math.round(wx(px)),Math.round(wy(py)));updateExplore();}
  draw();});
function endDrag(){if(!drag)return;drag=null;cv.style.cursor=hover?'grab':'default';draw();}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',()=>{if(!drag){hover=null;draw();}});
/* מקלדת */
cv.addEventListener('keydown',e=>{
  const items=st.stage===0?st.pieces:st.stage===3?['A','B','C','D']:[];if(!items.length)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();const i=items.indexOf(st.sel);st.sel=items[(i+1)%items.length];draw();return;}
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(!d||!st.sel)return;e.preventDefault();
  if(st.stage===0){const pc=st.sel,xs=pc.pts.map(v=>v[0]+pc.dx+d[0]),ys=pc.pts.map(v=>v[1]+pc.dy+d[1]);if(Math.min(...xs)>=XMIN&&Math.max(...xs)<=XMAX&&Math.min(...ys)>=YMIN&&Math.max(...ys)<=YMAX){pc.dx+=d[0];pc.dy+=d[1];updateBuild();}}
  else{const v=st.E[st.sel];moveVertex(st.sel,v[0]+d[0],v[1]+d[1]);updateExplore();}
  draw();});

/* ---------- איפוס / מצב חדש ---------- */
$('#resetBtn').onclick=()=>{freshState(0);render();};
$('#newBtn').onclick=()=>{T=randomT();freshState(0);render();};
new ResizeObserver(()=>{layout();draw();}).observe(cv);
freshState(0);layout();render();document.fonts&&document.fonts.ready.then(()=>draw());
window.__app={get st(){return st;},get T(){return T;},sx,sy,goStage,measures};
})();
</script>
